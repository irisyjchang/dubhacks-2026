# Local smoke test on a small MMFS cache subset (scripts/build_mmfs_cache.py --max-programs 30).
_base_: mmfs_mac_small.yaml
data:
  root: data/mmfs_cache_small
  window: 256
  stride: 128
  num_workers: 0
train:
  batch_size: 4
  log_every: 2
  ckpt_every: 4
  eval_every: 6
  stages:
    - {name: clean, steps: 6, noise: false, lr: 1.0e-3, warmup: 2}
    - {name: noisy, steps: 4, noise: true, lr: 3.0e-4, warmup: 1}
infer:
  window: 256
  stride: 192
eval:
  max_programs: 3
output:
  dir: runs/mmfs_smoke
