# Single H100 80GB (Thunder Compute). Run stage by stage via thunder/train_h100.sh
# (--stage-only clean, then --stage-only noisy with train.init_from=<clean best.pt>).
_base_: base.yaml
data:
  num_workers: 8               # plan generation only (cheap) when gpu_preload is on
  prefetch_factor: 4
  gpu_preload: true            # whole skeleton set on the GPU (~1.5-2 GB); aug + features computed on GPU
train:
  device: cuda
  batch_size: 32
  amp: bf16
  compile: true                # set false if torch.compile errors on the instance
  compile_mode: default
  sync_bn: false
  log_every: 50
  ckpt_every: 500
  eval_every: 1000
  stages:
    - {name: clean, steps: 20000, noise: false, lr: 1.0e-3, warmup: 800, select_metric: tes/mae}
    - {name: noisy, steps: 8000, noise: true, lr: 3.0e-4, warmup: 300, select_metric: noisy/tes/mae}
infer:
  batch_size: 32
output:
  dir: runs/h100
